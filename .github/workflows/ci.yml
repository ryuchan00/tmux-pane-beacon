name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux bats shellcheck
      - name: tmux version
        run: tmux -V
      - name: Lint
        run: make lint
      - name: Test
        run: make test
