name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux は musl で静的リンクする。glibc 動的リンクだと、ビルドした
          # ランナーより古い glibc の環境で GLIBC_x.yz not found になるため
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # プラグインは Cargo.toml の version からタグ名を組み立てて取得するため、
      # ずれたタグで公開すると誰もダウンロードできないリリースになる
      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Stage binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/pane-beacon" "dist/pane-beacon-${{ matrix.target }}"
      # 各ランナーはターゲットと同じ OS/CPU なので、公開前にそのまま実行できる
      - name: Smoke test binary
        run: dist/pane-beacon-${{ matrix.target }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: pane-beacon-${{ matrix.target }}
          path: dist/pane-beacon-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          chmod +x pane-beacon-*
          sha256sum pane-beacon-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pane-beacon-*
            dist/SHA256SUMS
          generate_release_notes: true
